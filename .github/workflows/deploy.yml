name: Deploy to server (rsync over SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys the full Laravel app to a PHP 8.4 server over SSH. The upload steps
# run only when the repository variable DEPLOY_ENABLED is "true" and the
# SSH_HOST, SSH_PORT, SSH_USERNAME, SSH_PASSWORD, DEPLOY_PATH and ENV_FILE
# secrets are set (see DEPLOY.md); otherwise the job only checks the build.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore file timestamps from git history
        uses: chetan/git-restore-mtime-action@v2

      - name: Write production .env
        run: printf '%s' "${{ secrets.ENV_FILE }}" > .env

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Install rsync tools
        if: vars.DEPLOY_ENABLED == 'true'
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Deploy via rsync over SSH
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -e
          sshpass -e rsync -az --stats \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.idea' \
            --exclude='.claude' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env.example' \
            --exclude='.env.production' \
            --exclude='.editorconfig' \
            --exclude='.gitattributes' \
            --exclude='.npmrc' \
            --exclude='boost.json' \
            --exclude='phpstan.neon' \
            --exclude='phpunit.xml' \
            --exclude='pint.json' \
            --exclude='CLAUDE.md' \
            --exclude='Claude outputs' \
            --exclude='/storage/logs' \
            --exclude='/storage/framework/cache' \
            --exclude='/storage/framework/sessions' \
            --exclude='/storage/framework/views' \
            --exclude='/public/storage' \
            --exclude='/public/hot' \
            ./ "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}"

      - name: Migrate and cache config, routes and views
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && php artisan migrate --force && php artisan optimize && (php artisan storage:link || true)"
