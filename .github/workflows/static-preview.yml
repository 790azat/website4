name: Static preview (Vercel)

# Builds the site as static HTML (`php artisan site:export`) and publishes it
# to the `static` branch. Vercel deploys that branch as the preview site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-preview
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build
          rm -f public/hot

      - name: Export static site
        run: php artisan site:export --out=dist

      - name: Publish to the static branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: static
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'Static export of ${{ github.sha }}'
